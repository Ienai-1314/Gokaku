<!DOCTYPE html>
<html>
<head>
    <title>Test</title>
</head>
<body>
    <h1>Test Page</h1>
    <script>
        fetch('http://localhost:3000')
            .then(r => r.text())
            .then(html => {
                console.log('HTML length:', html.length);
                console.log('Has Hero:', html.includes('Hero'));
                console.log('Has script tags:', html.includes('<script'));
            })
            .catch(e => console.error('Error:', e));
    </script>
</body>
</html>
